<!DOCTYPE html>
<html>
<head>
	<title>Process Manager</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<style>
    	/* Smooth sidebar animation */
    	#sidebar {
        	width: 250px;
        	transition: all 0.3s ease;
    	}

    	/* Hidden state */
    	#sidebar.collapsed {
        	margin-left: -250px;
    	}

    	/* Content shifts when sidebar hidden */
    	#content {
        	transition: all 0.3s ease;
    	}

    	#content.expanded {
        	margin-left: 0;
    	}
	</style>
</head>

<body>

<div class="d-flex">

	<!-- Sidebar -->
	<div id="sidebar" class="bg-dark text-white p-3 vh-100">
    	<h4>Menu</h4>
    	<hr>

    	<ul class="nav nav-pills flex-column">

        	<li class="nav-item">
            	<a href="/" class="nav-link text-white {% if request.path == '/' %}active{% endif %}">
                	Home
            	</a>
        	</li>

        	<li class="nav-item">
            	<a href="/process" class="nav-link text-white {% if '/process' in request.path %}active{% endif %}">
                	Process Guide
            	</a>
        	</li>

        	<li class="nav-item">
            	<a href="/tpm" class="nav-link text-white {% if '/tpm' in request.path %}active{% endif %}">
                	TPM
            	</a>
        	</li>

        	<li class="nav-item">
            	<a href="/settings" class="nav-link text-white {% if '/settings' in request.path %}active{% endif %}">
                	Settings
            	</a>
        	</li>

    	</ul>
	</div>

	<!-- Main Content -->
	<div id="content" class="p-4 w-100">

    	<!-- Toggle Button -->
    	<button class="btn btn-dark mb-3" onclick="toggleSidebar()">☰ Menu</button>

    	{% block content %}
    	{% endblock %}

	</div>

</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
function toggleSidebar() {
	const sidebar = document.getElementById("sidebar");
	sidebar.classList.toggle("collapsed");
}
</script>

</body>
</html>
